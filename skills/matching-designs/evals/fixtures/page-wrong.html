<!doctype html><html><head><style>
body{margin:0;font-family:Helvetica,Arial,sans-serif;background:#fff;color:#1a1a1a}
header{height:64px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 32px;font-size:18px}
main{padding:48px 32px}
h1{font-size:40px;margin:0 0 16px;color:#333}
p{font-size:16px;line-height:24px;max-width:560px;margin:0 0 24px;color:#475569}
.btn{display:inline-block;padding:12px 24px;background:#1d4ed8;color:#fff;border-radius:6px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{border:1px solid #e2e8f0;border-radius:8px;padding:24px;height:120px}
</style></head><body><header>Acme</header><main><h1>Ship faster</h1><p>A short paragraph that explains the product in two lines of body copy.</p><span class="btn">Get started</span>
