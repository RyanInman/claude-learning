    contentTop: 0.8
    margin: 0.95
    kicker: This Week
    title:
      size: 38
      lines:
        - text: Three things to try
        - text: before Friday
          color: accent
    notes: >-
      If you take nothing else: the context window is the whole game, and you control what's in it.

      Three concrete things. Run /init on one repo. Try plan mode on the next non-trivial task. And
      build the rewind habit — that's the one that compounds fastest.

