  - kicker: 07 · Pro-Tips
    title: Ask Me Questions
    subtitle: Tell Claude to ask you questions to help you solidify your idea.
    notes: >-
      This is the one for when you know roughly what you want but could not write a ticket for it
      yet.

      Adding one line — ask me clarifying questions — flips the whole exchange. Instead of guessing
      at the half of the idea you did not say, it asks, and you answer with a keypress.

      Two skills do this properly: /brainstorming for shaping an idea, /grill-me for stress-testing
      one you have already shaped.
    elements:
      - type: columns
        widths:
          - 0.46
          - 0.54
        items:
          - - type: code
              title: your prompt
              fontSize: 11
              lines:
                - t: I want to add a saved-reports
                  c: okCode
                - t: page to the admin app.
                  c: okCode
                - t: ''
                  c: okCode
                - t: Ask Me Clarifying Questions
                  c: okCode
                  b: true
            - type: code
              title: false
              fontSize: 11
              lines:
                - t: Who can see a saved report?
                  b: true
                - t: ❯ 1. Any signed-in user
                  c: okCode
                - t: '  2. Admins only'
                - t: '  3. Only the person who saved it'
                - t: ''
                - t: Where do reports get stored?
                  b: true
                - t: '  1. A new reports table'
                - t: ❯ 2. Reuse reports + a saved flag
                  c: okCode
          - - type: icon_rows
              layout: list
              dividers: true
              items:
                - icon: chat
                  name: Start with an idea
                  body: A half-formed idea that needs some iteration.
                - icon: bulb
                  name: Claude Asks You
                  body: What you actually mean, what is in and out of scope, what done looks like.
                - icon: check
                  name: End specific
                  body: A fleshed-out plan, concrete enough to hand straight to plan mode.
            - type: callout
              style: tint
              icon: gear
              text: The /brainstorming and /grill-me skills run this loop for you.
  - kicker: 07 · Pro-Tips
    title: Debug Loop
    subtitle: A disciplined loop for hard bugs and performance regressions.
    notes: >-
      This is the one that stops the guess-and-check spiral.

      The discipline is that a fix does not count until there is a regression test that would have
      caught the bug. That is the whole difference between fixing a bug and appearing to.
    elements:
      - type: columns
        widths:
          - 0.5
          - 0.5
        items:
          - - type: code
              title: diagnose
              fontSize: 11
              lines:
                - t: /diagnose When I run
                  c: okCode
                - t: <insert_command> I get this
                  c: okCode
                - t: error <error_log> - list top
                  c: okCode
                - t: 3 causes and suggest a fix
                  c: okCode
          - - type: icon_rows
              layout: list
              dividers: true
              items:
                - icon: search
                  name: Describe the Issue
                  body: What you did, what broke.
                - icon: doc
                  name: Paste a Log
                  body: The real error text, not a summary.
                - icon: check
                  name: Expected vs Actual
                  body: What should have happened, and what happened instead.
      - type: callout
        style: tint
        icon: gear
        bold: /diagnose
        text: Great for troubleshooting bugs or cryptic errors.
  - kicker: 07 · Pro-Tips
    title: Adversarial Review
    subtitle: |-
      Normal review — getting a check-up with your primary doctor.
      Adversarial review — getting a second opinion.
    notes: >-
      Cheapest review you will ever run, because nothing has been built yet.

      Point it at a plan, a design doc, or a PR description. It argues the other side properly
      instead of agreeing with you.
    elements:
      - type: columns
        widths:
          - 0.42
          - 0.58
        items:
          - - type: code
              title: adversarial review
              fontSize: 12
              lines:
                - t: Review @my-plan.md looking
                  c: okCode
                - t: for high-value criticism
                  c: okCode
                - t: ''
                - t: '> 3 assumptions that do not'
                  c: codeDim
                - t: '>   survive contact'
                  c: codeDim
                - t: '> 1 cheaper alternative'
                  c: codeDim
          - - type: icon_rows
              layout: list
              dividers: true
              items:
                - icon: cross
                  name: Critical Eye
                  body: Criticizes instead of agreeing.
                - icon: bulb
                  name: Fresh Perspective
                  body: Approaches without prior knowledge.
                - icon: search
                  name: Reduces Bias
                  body: Sees outside the context of the original session.
            - type: callout
              style: tint
              icon: gear
              bold: /adversarial-review
              text: Runs the second opinion for you, on a plan or a diff.
