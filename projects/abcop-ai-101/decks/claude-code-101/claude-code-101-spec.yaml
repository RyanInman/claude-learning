      Welcome. Roughly forty minutes, seven short sections.

      We'll do the CLI, but almost everything applies to Desktop and the VS Code extension too —
      I'll flag the places they differ.

      The through-line: everything in this deck is really a decision about context. If you leave
      with only that, it was worth it.

      Ask questions as we go rather than saving them for the end.
